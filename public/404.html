<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="The requested page could not be found. Return to Adam Nordling's portfolio homepage."
        />
        <meta name="theme-color" content="#131418" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self';"
        />

        <title>404 — Page Not Found | Adam Nordling</title>
        <link rel="icon" type="image/x-icon" href="./assets/favicons/favicon.ico" />

        <style>
            :root {
                --bg: #131418;
                --card: #1c1d23;
                --text: #f8fafc;
                --muted: #94a3b8;
                --accent: #60a5fa;
                --border: #2e303b;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                text-align: center;
                padding: 24px;
                line-height: 1.6;
            }

            .error-card {
                background-color: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 48px 32px;
                max-width: 480px;
                width: 100%;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            }

            .error-code {
                font-size: 5.5rem;
                font-weight: 800;
                color: var(--accent);
                font-family: ui-monospace, SFMono-Regular, monospace;
                line-height: 1;
                margin-bottom: 8px;
                letter-spacing: -0.04em;
            }

            h1 {
                font-size: 1.5rem;
                font-weight: 700;
                margin-bottom: 12px;
                color: var(--text);
            }

            p {
                color: var(--muted);
                font-size: 0.95rem;
                margin-bottom: 32px;
            }

            .home-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background-color: var(--text);
                color: var(--bg);
                font-weight: 600;
                font-size: 0.9rem;
                text-decoration: none;
                padding: 12px 28px;
                border-radius: 6px;
                transition:
                    opacity 0.2s ease,
                    transform 0.2s ease;
                min-height: 44px;
            }

            .home-btn:hover,
            .home-btn:focus-visible {
                opacity: 0.9;
                transform: translateY(-1px);
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <main class="error-card" aria-labelledby="error-heading">
            <div class="error-code" aria-hidden="true">404</div>
            <h1 id="error-heading">Page Not Found</h1>
            <p>The page or resource you are looking for has moved or does not exist.</p>
            <nav aria-label="Error recovery navigation">
                <a href="./" class="home-btn" aria-label="Return to portfolio homepage">Back to Portfolio</a>
            </nav>
        </main>
    </body>
</html>
