<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
    <defs>
        <!-- Canvas Gradients -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0b0e14"/>
            <stop offset="100%" stop-color="#121722"/>
        </linearGradient>
        <linearGradient id="mintCyan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00dc82"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <!-- Subtle Background Grid -->
        <pattern id="cardGrid" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1e2638" stroke-width="0.7"/>
        </pattern>
    </defs>

    <!-- Canvas Frame -->
    <rect width="400" height="160" rx="8" fill="url(#bgGrad)"/>
    <rect width="400" height="160" rx="8" fill="url(#cardGrid)" opacity="0.45"/>
    <rect width="398" height="158" x="1" y="1" rx="7" stroke="#1e2638" stroke-width="1.2"/>

    <!-- 1. LEFT MINI SIDEBAR (App Shell Navigation) -->
    <g transform="translate(14, 16)">
        <rect width="44" height="128" rx="6" fill="#10141e" stroke="#1e2638" stroke-width="1"/>
        <!-- Brand Stack Icon -->
        <rect x="12" y="10" width="20" height="20" rx="5" fill="url(#mintCyan)"/>
        <polygon points="22,14 17,17 22,20 27,17" fill="#0b0e14"/>
        <polyline points="17,21 22,24 27,21" fill="none" stroke="#0b0e14" stroke-width="1.2"/>
        <polyline points="17,24 22,27 27,24" fill="none" stroke="#0b0e14" stroke-width="1.2"/>

        <!-- Mini Nav Badges -->
        <rect x="8" y="38" width="28" height="12" rx="3" fill="#1a2233" stroke="#00dc82" stroke-width="0.8"/>
        <circle cx="14" cy="44" r="2" fill="#00dc82"/>
        <line x1="19" y1="44" x2="30" y2="44" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>

        <g opacity="0.65">
            <circle cx="14" cy="60" r="2" fill="#38bdf8"/>
            <line x1="19" y1="60" x2="30" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

            <circle cx="14" cy="74" r="2" fill="#8b5cf6"/>
            <line x1="19" y1="74" x2="30" y2="74" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

            <circle cx="14" cy="88" r="2" fill="#f59e0b"/>
            <line x1="19" y1="88" x2="30" y2="88" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

            <circle cx="14" cy="102" r="2" fill="#f43f5e"/>
            <line x1="19" y1="102" x2="30" y2="102" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <circle cx="22" cy="120" r="3" fill="#64748b" opacity="0.5"/>
    </g>

    <!-- 2. CENTER PANEL: Mission Control Cockpit (Time, Telemetry & Solar HUD) -->
    <g transform="translate(66, 16)">
        <rect width="168" height="128" rx="6" fill="#10141e" stroke="#2a354c" stroke-width="1"/>

        <!-- Header -->
        <circle cx="12" cy="12" r="2.5" fill="#f43f5e" opacity="0.9"/>
        <circle cx="20" cy="12" r="2.5" fill="#f59e0b" opacity="0.9"/>
        <circle cx="28" cy="12" r="2.5" fill="#00dc82" opacity="0.9"/>
        <text x="38" y="14.5" fill="#64748b" font-family="monospace" font-size="7" font-weight="700">MISSION CONTROL HUD</text>
        <rect x="126" y="7" width="34" height="11" rx="2" fill="#1e2638"/>
        <text x="130" y="15" fill="#00dc82" font-family="monospace" font-size="6" font-weight="700">ACTIVE</text>

        <!-- Digital Epoch & Time Display -->
        <rect x="10" y="24" width="148" height="34" rx="4" fill="#07090e" stroke="#1e2638" stroke-width="0.8"/>
        <text x="16" y="47" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="800" letter-spacing="1">10:14:00</text>
        <text x="106" y="38" fill="#38bdf8" font-family="monospace" font-size="6.5" font-weight="700">UTC / CET</text>
        <text x="106" y="49" fill="#00dc82" font-family="monospace" font-size="6" font-weight="600">LIVE SYNC</text>

        <!-- Dynamic Solar Horizon Curve & Telemetry Stream -->
        <path d="M 12 88 Q 45 64 84 80 T 156 70" fill="none" stroke="url(#mintCyan)" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="84" cy="80" r="3" fill="#f59e0b"/>

        <!-- Workstation Telemetry Rows -->
        <g transform="translate(10, 96)">
            <rect width="148" height="24" rx="3" fill="#151a26" stroke="#1e2638" stroke-width="0.8"/>
            <text x="8" y="11" fill="#94a3b8" font-family="monospace" font-size="6">LATENCY: <tspan fill="#00dc82" font-weight="700">12ms</tspan></text>
            <text x="82" y="11" fill="#94a3b8" font-family="monospace" font-size="6">SHIELD: <tspan fill="#38bdf8" font-weight="700">ACTIVE</tspan></text>
            <text x="8" y="20" fill="#94a3b8" font-family="monospace" font-size="6">MEMORY: <tspan fill="#f8fafc" font-weight="700">CLEAN</tspan></text>
            <text x="82" y="20" fill="#94a3b8" font-family="monospace" font-size="6">HOST: <tspan fill="#8b5cf6" font-weight="700">EDGE</tspan></text>
        </g>
    </g>

    <!-- 3. RIGHT PANEL: 100+ Modular Developer Utilities Hub -->
    <g transform="translate(242, 16)">
        <rect width="144" height="128" rx="6" fill="#10141e" stroke="#2a354c" stroke-width="1"/>

        <!-- Header -->
        <text x="10" y="15" fill="#f8fafc" font-family="monospace" font-size="7.5" font-weight="800">UTILITY SUITE</text>
        <rect x="76" y="7" width="58" height="12" rx="3" fill="#1e2638"/>
        <text x="80" y="15.5" fill="#38bdf8" font-family="monospace" font-size="6" font-weight="700">100% CLIENT</text>

        <!-- Utility Tiles Grid -->
        <g transform="translate(8, 24)">
            <!-- Tile 1: Hash & Cryptography -->
            <rect x="0" y="0" width="61" height="28" rx="3" fill="#151a26" stroke="#1e2638" stroke-width="0.8"/>
            <text x="6" y="12" fill="#00dc82" font-family="monospace" font-size="7" font-weight="800">#</text>
            <text x="16" y="12" fill="#f8fafc" font-family="monospace" font-size="6.5" font-weight="700">CRYPTO</text>
            <text x="6" y="22" fill="#64748b" font-family="monospace" font-size="5.5">SHA · Hashes</text>

            <!-- Tile 2: Subnet & CIDR -->
            <rect x="67" y="0" width="61" height="28" rx="3" fill="#151a26" stroke="#1e2638" stroke-width="0.8"/>
            <text x="73" y="12" fill="#38bdf8" font-family="monospace" font-size="7" font-weight="800">/24</text>
            <text x="89" y="12" fill="#f8fafc" font-family="monospace" font-size="6.5" font-weight="700">NET</text>
            <text x="73" y="22" fill="#64748b" font-family="monospace" font-size="5.5">CIDR · Subnet</text>

            <!-- Tile 3: Converters & Time -->
            <rect x="0" y="34" width="61" height="28" rx="3" fill="#151a26" stroke="#1e2638" stroke-width="0.8"/>
            <text x="6" y="46" fill="#f59e0b" font-family="monospace" font-size="7" font-weight="800">⇄</text>
            <text x="16" y="46" fill="#f8fafc" font-family="monospace" font-size="6.5" font-weight="700">TIME</text>
            <text x="6" y="56" fill="#64748b" font-family="monospace" font-size="5.5">UTC Converter</text>

            <!-- Tile 4: Scratchpad Buffer -->
            <rect x="67" y="34" width="61" height="28" rx="3" fill="#151a26" stroke="#1e2638" stroke-width="0.8"/>
            <text x="73" y="46" fill="#8b5cf6" font-family="monospace" font-size="7" font-weight="800">❐</text>
            <text x="83" y="46" fill="#f8fafc" font-family="monospace" font-size="6.5" font-weight="700">BUFFER</text>
            <text x="73" y="56" fill="#64748b" font-family="monospace" font-size="5.5">Scratchpad</text>
        </g>

        <!-- Expanding Pipeline Node Banner -->
        <g transform="translate(8, 96)">
            <rect width="128" height="24" rx="3" fill="#0b0e14" stroke="#1e2638" stroke-width="0.8"/>
            <circle cx="12" cy="12" r="3.5" fill="#00dc82" opacity="0.2"/>
            <circle cx="12" cy="12" r="2" fill="#00dc82"/>
            <text x="22" y="11" fill="#f8fafc" font-family="monospace" font-size="6.5" font-weight="700">100+ TOOL SUITE</text>
            <text x="22" y="19" fill="#94a3b8" font-family="monospace" font-size="5.5">Zero Cloud Uploads · Private</text>
        </g>
    </g>
</svg>